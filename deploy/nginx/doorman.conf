# The doorman's two TLS ports: 3000, the validator door, proxied to the Node
# door on 127.0.0.1:8000, and 3200, the keyholder door, proxied to
# 127.0.0.1:8200. The two server blocks differ only in their port, body cap
# and upstream. Installed as /etc/nginx/sites-available/doorman and linked
# into sites-enabled by scripts/install-system-files.sh, once the
# certificate exists at /etc/doorman/tls (acme.sh puts it there; README,
# "The doorman VM", step 4). The certificate is for the doorman's IP, so
# there is no server_name and the file is the same on every doorman.
#
# The four port numbers (3000, 3200, 8000, 8200) duplicate
# network/testnet.env on purpose: nginx reads no env file. Change them in
# both places. The body cap of each port is its largest route cap; the Node
# door caps per route. The access log is what fail2ban reads
# (deploy/fail2ban/doorman.conf); Debian's logrotate rotates it daily and
# keeps 14.
server {
    listen 3000 ssl default_server;
    server_tokens off;
    ssl_certificate /etc/doorman/tls/fullchain.pem;
    ssl_certificate_key /etc/doorman/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    access_log /var/log/nginx/doorman-access.log;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}';
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;
    }
}

server {
    listen 3200 ssl default_server;
    server_tokens off;
    ssl_certificate /etc/doorman/tls/fullchain.pem;
    ssl_certificate_key /etc/doorman/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 30s;
    access_log /var/log/nginx/doorman-access.log;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}';
    }
    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 600s;
    }
}
