# The doorman's port 80: only the ACME HTTP-01 challenge, which acme.sh
# writes under /var/www/acme when it issues or renews the certificate
# (README, "The doorman VM", step 4); everything else on this port is 404.
# Installed as /etc/nginx/sites-available/doorman-acme and linked into
# sites-enabled by scripts/install-system-files.sh. The same on every
# doorman.
server {
    listen 80 default_server;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 404;
    }
}
