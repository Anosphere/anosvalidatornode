# One line of nginx's combined access log answered 429. Installed as
# /etc/fail2ban/filter.d/doorman-429.conf by scripts/install-system-files.sh.
# fail2ban cuts the date out of a line before matching, which leaves the
# brackets empty, so the bracket group takes zero or more characters; the
# \s after 429 keeps a status of 429 from matching anything longer, and is
# written as \s because a trailing space would not survive the config
# parser.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]*\] "[^"]*" 429\s
ignoreregex =
