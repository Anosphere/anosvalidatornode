# The doorman's jail: an IP that collects 20 answers of 429 within 60
# seconds in nginx's access log is banned for 10 minutes on every port.
# Allowlisted IPs never get a 429 (the door skips their bucket), so no
# ignoreip is needed. The sshd jail Debian enables is off: port 22 only
# ever sees the IAP range. Installed as /etc/fail2ban/jail.d/doorman.conf
# by scripts/install-system-files.sh; it sorts after Debian's
# defaults-debian.conf and so overrides it.
[DEFAULT]
banaction = nftables-allports
banaction_allports = nftables-allports

[sshd]
enabled = false

[doorman-429]
enabled = true
filter = doorman-429
logpath = /var/log/nginx/doorman-access.log
maxretry = 20
findtime = 60
bantime = 600
